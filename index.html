<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Larder apps</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--muted:#6e6e73;--green:#2e9e4f}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--muted:#98989f}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,sans-serif;padding:max(48px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 40px max(20px,env(safe-area-inset-left))}
h1{font-size:34px;margin:0 0 6px}p{color:var(--muted);margin:0 0 24px}
a.app{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;color:inherit;text-decoration:none}
a.app img{width:60px;height:60px;border-radius:14px}a.app b{display:block;font-size:19px}a.app span{color:var(--muted);font-size:15px}
ol{color:var(--muted);padding-left:20px;font-size:15px}
</style></head><body>
<h1>Larder</h1>
<p>Open each app below, then add it to your Home Screen.</p>
<a class="app" href="larder/"><img src="larder/apple-touch-icon.png" alt=""><div><b>Larder</b><span>Meal plan, kitchen and shopping</span></div></a>
<a class="app" href="notes/"><img src="notes/apple-touch-icon.png" alt=""><div><b>Larder Notes</b><span>The shared notes</span></div></a>
<ol><li>Tap an app above.</li><li>Tap the Share button, then <b>Add to Home Screen</b>.</li><li>Do the same for the other one.</li><li>Always open them from the Home Screen icons.</li></ol>
</body></html>
